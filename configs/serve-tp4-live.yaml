# Serve config captured from the measured 4x Spark TP4 deployment (2026-09-23).
#
# Source: /tmp/serve-tp4-d203.yaml inside the `dsv41-tp4` container on the vLLM
# server node. profiles/tp4.env reproduces it through scripts/serve_tp4.sh;
# keep the two in sync (tests/test_tp4_deployed_profile_contract.py).
#
# Runtime identity of the captured run:
#   image           deepseek-v41-exl3:fresh
#                   sha256:8c56095510365c839082869bfcb7d786a555e5cf37688ec43d9f70a0c0688bef
#   base image      vllm/vllm-openai:deepseekv41-flash-0909
#   vllm-exl3       vcruz305/vllm-exl3 @ 814d4fe38082cddd838b45418c7d13a95395a36a
#                   + MoE kernels from PR #33 (4c95648) + tools/dspark patches
#   exllamav3       turboderp-org/exllamav3 @ be57335b087e4f001c5caae061544df3c06ba01e
#   arch list       TORCH_CUDA_ARCH_LIST=12.1a, CUDA 13.0.1
#   topology        TP4 + EP4 over 4x GB10
#   model           /models/dsv41-orig: the 4.75bpw pack plus the backbone
#                   shard built locally by fix_missing_backbone.py; the published
#                   repo ships that shard since b0c44df (33 shards)
#   Engram          VLLM_ENGRAM_DISK_BACKED=1 in the launcher environment
#
# Boot-log values: KV reserved 8.0 GiB (profiling skipped, so
# gpu-memory-utilization is inert), GPU KV cache 2,454,802 tokens, max
# concurrency 2.34x at 1,048,576 tokens per request.
model: /models/dsv41-orig
quantization: exl3
tokenizer-mode: deepseek_v41
tensor-parallel-size: 4
enable-expert-parallel: true
enable-ep-weight-filter: true
distributed-executor-backend: ray
language-model-only: true
tool-call-parser: deepseek_v41
enable-auto-tool-choice: true
reasoning-parser: deepseek_v41
served-model-name: deepseek-v41-exl3
host: 0.0.0.0
port: 8002
gpu-memory-utilization: 0.55
kv-cache-memory-bytes: 8589934592
max-model-len: 1048576
max-num-seqs: 4
max-num-batched-tokens: 4096
block-size: 128
enforce-eager: false
trust-remote-code: true
enable-prefix-caching: true
engram-config:
  cpu_offload: false
speculative-config:
  method: dspark
  num_speculative_tokens: 2
  draft_sample_method: probabilistic
  rejection_sample_method: block
  quantization: mxfp4
compilation-config:
  cudagraph_mode: FULL_DECODE_ONLY
  cudagraph_capture_sizes: [3, 6, 9, 12]
